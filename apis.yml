aid: kimola
name: Kimola
description: >-
  Kimola is a market research automation platform that turns customer feedback
  into research insights. It tracks feedback from social media, reviews, and
  direct uploads; analyzes it with AI to detect themes, sentiment, and patterns
  across 30+ languages; and generates executive summaries, customer personas,
  pain points, and journey maps. Kimola exposes a public REST API for presets
  (pre-trained classification and entity-extraction models), reports, feedback
  feeds, query consumption, and subscription usage, plus the Kimola Cognitive
  API for running text through custom and pre-built classification models and
  returning tagged predictions with probabilities. Official Python, Node.js, and
  C# SDKs are published. Kimola is backed by 500 Global.
